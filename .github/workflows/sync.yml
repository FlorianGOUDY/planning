name: Synchro planning

on:
  schedule:
    - cron: "0 5 * * *"        # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la main
  push:
    paths: [".github/workflows/sync.yml", "planning_ics.py"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python planning_ics.py --download --tous --outdir docs
      - name: Publier si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "Mise à jour du planning" && git push)
